services:
  postgres:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: powder
      POSTGRES_PASSWORD: powder
      POSTGRES_DB: powder
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
